<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Team Message</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* ---- Global Style ---- */
body {
  margin: 0;
  padding: 0;
  font-family: 'Roboto', sans-serif;
  background: radial-gradient(circle at top left, #7b2ff7, #4f46e5, #2563eb);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #fff;
  overflow: hidden;
}

/* ---- Decorative Glow Orbs ---- */
body::before, body::after {
  content: "";
  position: absolute;
  width: 550px;
  height: 550px;
  border-radius: 50%;
  filter: blur(150px);
  opacity: 0.55;
  z-index: -1;
}
body::before {
  top: -120px;
  left: -120px;
  background: #9333ea;
}
body::after {
  bottom: -120px;
  right: -120px;
  background: #2563eb;
}

/* ---- Card ---- */
.card {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  padding: 45px 35px;
  text-align: center;
  max-width: 600px;
  width: 90%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.15);
  animation: fadeIn 0.8s ease forwards;
}

/* ---- Title ---- */
h1 {
  margin-bottom: 28px;
  font-weight: 700;
  font-size: 26px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.3);
  letter-spacing: 0.5px;
}

/* ---- Buttons ---- */
button {
  margin: 10px;
  padding: 13px 26px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.25s ease;
  color: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  transform: translateY(0);
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

#thankBtn { background: linear-gradient(135deg, #ff6b6b, #ff4757); }
#endBtn { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
#copyBtn { background: linear-gradient(135deg, #54a0ff, #2e86de); }

/* ---- Message ---- */
#message {
  margin-top: 35px;
  font-size: 19px;
  min-height: 80px;
  line-height: 1.55;
  padding: 0 15px;
  transition: opacity 0.3s ease;
  animation: fadeInSoft 0.5s ease forwards;
}

/* ---- Dropdown ---- */
#shiftOptions {
  margin-top: 18px;
  display: none;
  animation: fadeInSoft 0.5s ease forwards;
}

select {
  padding: 10px 14px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.85);
  color: #333;
  font-weight: 500;
}

/* ---- Tooltip ---- */
.tooltip {
  display: inline-block;
  position: relative;
}

.tooltip .tooltiptext {
  visibility: hidden;
  width: 120px;
  background-color: rgba(0,0,0,0.8);
  color: #fff;
  text-align: center;
  border-radius: 8px;
  padding: 6px 0;
  position: absolute;
  z-index: 1;
  bottom: 135%;
  left: 50%;
  margin-left: -60px;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.tooltip.show .tooltiptext {
  visibility: visible;
  opacity: 1;
}

/* ---- Animations ---- */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInSoft {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>
<div class="card">
<h1>Random Team Message</h1>

<button id="thankBtn">Thanking Message</button>
<button id="endBtn">End of Shift</button>

<div id="shiftOptions">
  <label for="daysOff">Wähle freie Tage: </label>
  <select id="daysOff">
    <option value="1">1 Tag frei</option>
    <option value="2">2 Tage frei</option>
  </select>
</div>

<div id="message"></div>

<div class="tooltip">
  <button id="copyBtn">Copy Message</button>
  <span class="tooltiptext" id="tooltipText">Copied!</span>
</div>

</div>

<script>
/* --- Your JS unchanged (only formatted) --- */

const thankMessages = [...];   // keep your full arrays here!
const end1Day = [...];
const end2Days = [...];

const thankBtn = document.getElementById('thankBtn');
const endBtn = document.getElementById('endBtn');
const messageDiv = document.getElementById('message');
const shiftOptions = document.getElementById('shiftOptions');
const daysSelect = document.getElementById('daysOff');
const copyBtn = document.getElementById('copyBtn');
const tooltipText = document.getElementById('tooltipText');

function showMessage(list){
  const msg = list[Math.floor(Math.random()*list.length)];
  messageDiv.style.opacity = 0;
  setTimeout(() => {
    messageDiv.textContent = msg;
    messageDiv.style.opacity = 1;
  }, 150);
}

thankBtn.onclick = () => {
  showMessage(thankMessages);
  shiftOptions.style.display = 'none';
}

endBtn.onclick = () => {
  shiftOptions.style.display = 'block';
  showMessage(daysSelect.value === "2" ? end2Days : end1Day);
}

daysSelect.onchange = () => {
  showMessage(daysSelect.value === "2" ? end2Days : end1Day);
}

copyBtn.onclick = () => {
  const text = messageDiv.textContent;
  if(text){
    navigator.clipboard.writeText(text);
    tooltipText.classList.add('show');
    setTimeout(() => tooltipText.classList.remove('show'), 1200);
  }
}
</script>
</body>
</html>
